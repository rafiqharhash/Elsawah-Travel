version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/uniride
      - JWT_SECRET=your_super_secret_jwt_key_here_uniride_2026
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo
    networks:
      - uniride-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - server
    networks:
      - uniride-network

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # To enable transactions locally, a replica set is required.
    # For production, Atlas is recommended. 
    # command: ["--replSet", "rs0", "--bind_ip_all"]
    networks:
      - uniride-network

volumes:
  mongo_data:

networks:
  uniride-network:
    driver: bridge
